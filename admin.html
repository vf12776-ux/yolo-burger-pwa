<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YOLO Админ</title>
  <link rel="manifest" href="admin-manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    .hidden { display: none !important; }
    .admin-container { max-width: 600px; margin: 0 auto; padding: 20px; font-family: sans-serif; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #B0B0B0; }
    .form-group input, .form-group textarea { 
      width: 100%; padding: 10px; border: 1px solid #333; border-radius: 8px; 
      background: #1A1A1A; color: white; font-size: 16px; box-sizing: border-box;
    }
    .btn-primary { 
      width: 100%; padding: 12px; background: #E53935; color: white; 
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; 
    }
    .btn-delete { 
      padding: 8px 12px; background: #333; color: #E53935; 
      border: 1px solid #E53935; border-radius: 6px; cursor: pointer; 
    }
    .menu-item-admin { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 15px; background: #1A1A1A; border-radius: 8px; margin-bottom: 10px; 
    }
    #admin-msg { margin-top: 10px; font-weight: bold; min-height: 24px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { 
      flex: 1; padding: 12px; border: 2px solid #E53935; background: transparent; 
      color: #E53935; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .tab-btn.active { background: #E53935; color: white; }
    .order-card { 
      background: #1A1A1A; border-radius: 8px; padding: 15px; margin-bottom: 10px; 
      border-left: 4px solid #FFC107;
    }
    .order-card.done { border-left-color: #4CAF50; opacity: 0.6; }
    .order-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .order-id { color: #FFC107; font-weight: bold; }
    .order-time { color: #B0B0B0; font-size: 12px; }
    .order-items { color: #E0E0E0; font-size: 14px; margin: 8px 0; }
    .order-total { color: #4CAF50; font-weight: bold; font-size: 16px; }
    .order-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-sm { 
      padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; 
      font-size: 12px; font-weight: bold;
    }
    .btn-confirm { background: #4CAF50; color: white; }
    .btn-done { background: #2196F3; color: white; }
    .btn-cancel { background: #E53935; color: white; }
    .badge { 
      display: inline-block; background: #E53935; color: white; border-radius: 50%; 
      width: 20px; height: 20px; text-align: center; line-height: 20px; font-size: 12px; 
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>🍔 YOLO Админ</h1>
    
    <div id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="admin-email" value="admin@yolo.local">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="admin-password" value="YoloBurger2026!">
      </div>
      <button id="login-btn" class="btn-primary">Войти</button>
      <p id="login-error" style="color: #E53935; margin-top: 10px;"></p>
    </div>

    <div id="admin-panel" class="hidden">
      <button id="logout-btn" class="btn-delete" style="width: 100%; margin-bottom: 20px;">Выйти</button>
      
      <div class="tabs">
        <button class="tab-btn active" id="tab-menu" onclick="switchTab('menu')">🍔 Меню</button>
        <button class="tab-btn" id="tab-orders" onclick="switchTab('orders')">📋 Заказы <span id="orders-badge" class="badge hidden">0</span></button>
      </div>

      <!-- ВКЛАДКА МЕНЮ -->
      <div id="section-menu">
        <h2>Добавить блюдо</h2>
        <div class="form-group">
          <label>Название *</label>
          <input type="text" id="item-name" placeholder="Чизбургер">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="item-desc" rows="2" placeholder="Состав"></textarea>
        </div>
        <div class="form-group">
          <label>Цена (₽) *</label>
          <input type="number" id="item-price" placeholder="350">
        </div>
        <div class="form-group">
          <label>Ссылка на фото</label>
          <input type="text" id="item-image" placeholder="https://...">
        </div>
        <button id="add-item-btn" class="btn-primary">Добавить в меню</button>
        <p id="admin-msg"></p>
        <h2 style="margin-top: 30px;">Текущее меню</h2>
        <div id="admin-menu-list"></div>
      </div>

      <!-- ВКЛАДКА ЗАКАЗЫ -->
      <div id="section-orders" class="hidden">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h2 style="margin:0;">Заказы</h2>
    <button class="btn-sm" style="background:#757575; color:white; padding:8px 16px;" onclick="clearCompletedOrders()">🗑️ Очистить выполненные</button>
  </div>
  <div id="orders-list"></div>
</div>

    <div id="install-container" style="margin-top: 30px;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
