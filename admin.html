<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YOLO Админ</title>
  <link rel="manifest" href="admin-manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    .hidden { display: none !important; }
    .admin-container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #B0B0B0; }
    .form-group input, .form-group textarea { 
      width: 100%; padding: 10px; border: 1px solid #333; border-radius: 8px; 
      background: #1A1A1A; color: white; font-size: 16px; box-sizing: border-box;
    }
    .btn-primary { 
      width: 100%; padding: 12px; background: #E53935; color: white; 
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; 
    }
    .btn-delete { 
      padding: 8px 12px; background: #333; color: #E53935; 
      border: 1px solid #E53935; border-radius: 6px; cursor: pointer; 
    }
    .menu-item-admin { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 15px; background: #1A1A1A; border-radius: 8px; margin-bottom: 10px; 
    }
    #admin-msg { margin-top: 10px; font-weight: bold; min-height: 24px; }
    .install-hint, .install-instruction { 
      background: #1A1A1A; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; 
    }
    .chrome-btn, .copy-btn, .install-btn {
      margin-top: 10px; padding: 10px 15px; border: none; border-radius: 6px; 
      font-weight: bold; cursor: pointer; width: 100%;
    }
    .chrome-btn { background: #4285F4; color: white; }
    .copy-btn { background: #333; color: white; margin-top: 8px; }
    .install-btn { background: #4CAF50; color: white; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>🍔 YOLO Админ</h1>
    
    <!-- Форма входа -->
    <div id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="admin-email" value="admin@yolo.local">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="admin-password" value="YoloBurger2026!">
      </div>
      <!-- Убрали onclick, добавили id -->
      <button id="login-btn" class="btn-primary">Войти</button>
      <p id="login-error" style="color: #E53935; margin-top: 10px;"></p>
    </div>

    <!-- Панель администратора -->
    <div id="admin-panel" class="hidden">
      <!-- Убрали onclick, добавили id -->
      <button id="logout-btn" class="btn-delete" style="width: 100%; margin-bottom: 20px;">Выйти из аккаунта</button>
      
      <h2>Добавить блюдо</h2>
      <div class="form-group">
        <label>Название *</label>
        <input type="text" id="item-name" placeholder="Например: Чизбургер">
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="item-desc" rows="2" placeholder="Состав, особенности"></textarea>
      </div>
      <div class="form-group">
        <label>Цена (₽) *</label>
        <input type="number" id="item-price" placeholder="350">
      </div>
      <div class="form-group">
        <label>Ссылка на фото</label>
        <input type="text" id="item-image" placeholder="https://...">
      </div>
      <!-- Убрали onclick, добавили id -->
      <button id="add-item-btn" class="btn-primary">Добавить в меню</button>
      <p id="admin-msg"></p>

      <h2 style="margin-top: 30px;">Текущее меню</h2>
      <div id="admin-menu-list"></div>
    </div>

    <div id="install-container" style="margin-top: 30px;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
